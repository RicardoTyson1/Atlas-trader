[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trader"
version = "0.1.0"
description = "Rule-based intraday trading system with prop-firm risk controls (TradeLocker)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
tradelocker = ["tradelocker>=0.56"]
dev = ["pytest>=8"]

[project.scripts]
atlas = "atlas_trader.cli:main"

[tool.setuptools.packages.find]
include = ["atlas_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
