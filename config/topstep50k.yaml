# Topstep 50K-style rules, for practising on a $50k TradeLocker DEMO.
# Firm numbers from third-party guides (2026); VERIFY on topstep.com.
# Gold mapping: 1 MGC micro = $10 per $1 move = 0.10 lot XAUUSD (lotSize 100).

mode: backtest

account:
  starting_balance: 50000
  currency: USD

prop_rules:
  firm: topstep-50k-practice
  phase: funded                   # no "target reached" stop (balance is already above $53k; Ricardo trades on)
  profit_target_pct: 6.0          # $3,000 target
  daily_loss_pct: 1.0             # x safety_buffer 0.5 = bot day stop $250 (Ricardo, 2026-11-05; Topstep's own DLL is $1,000)
  daily_loss_basis: initial
  max_drawdown_pct: 4.0           # $2,000 maximum loss limit
  drawdown_type: trailing
  trailing_on: eod_balance        # trails end-of-day balance (Topstep style)
  trail_locks_at_initial: true
  min_trading_days: 0
  safety_buffer: 0.5              # bot stops at $250 down on the day / $1,000 of the $2,000 MLL
  daily_breach_permanent: false   # Topstep's DLL pauses the day; the MLL is what fails the account

risk:
  risk_per_trade_pct: 0.1         # $50 max loss per trade (Ricardo, 2026-11-05)
  max_trades_per_day: 8
  max_consecutive_losses: 3
  max_open_positions: 1
  max_lots: 0.1                   # Ricardo: 0.10 lots max (2026-11-05); bigger gets closed
  max_room_fraction_per_trade: 0.25
  cooldown_after_loss_minutes: 15 # July 15: re-entered 3 seconds after losses
  max_sizing_equity: 50000
  guardian: true
  guardian_auto_stop: true        # trade placed without a stop: after the grace time a stop is added at the
  guardian_stop_grace_seconds: 30 # max loss per trade ($50) and the trade stays open (Ricardo, 2026-11-05)

session:
  timezone: America/New_York
  open: "09:30"
  # Around the clock (Ricardo, 2026-11-05): entries any time except gold's daily break.
  trade_start: "00:00"
  last_entry: "16:30"
  flat_by: "16:50"                # flat before gold's 17:00 NY daily close
  reopen: "18:05"
  weekdays: [0, 1, 2, 3, 4]
  overnight: false

news_blackouts:
  minutes_before: 15
  minutes_after: 15
  events: []

instruments:
  XAUUSD.R:
    value_per_point: 100.0
    min_lot: 0.01
    lot_step: 0.01
    spread_points: 0.14
    slippage_points: 0.10
    commission_per_lot: 3.5

strategies: []                    # practice mode: you trade, the guardian enforces

tradelocker:
  demo_url: https://demo.tradelocker.com
  live_url: https://live.tradelocker.com
  demo_account_ids: [2595168]     # GatesFX TradeLocker DEMO #2595168 (accNum 4), Ricardo's 50K account
  live_account_ids: []

webhook:
  host: 0.0.0.0
  port: 8787
  default_reward_risk: 2.0

monitoring:
  label: "Atlas $50k guardian"            # prefix on every Telegram message
  healthcheck_env: HEALTHCHECK_URL_TOPSTEP50K      # env var holding this bot's healthchecks.io ping URL
  daily_report: true          # morning "armed" message + end-of-day report
  poll_seconds: 10            # check every 10 s so a missing stop is fixed fast

paths:
  state_dir: state/topstep50k
  log_dir: logs
  report_dir: reports
  kill_switch_file: state/topstep50k/KILL   # separate switch per bot
