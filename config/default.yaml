# Atlas Trader configuration.
# Anything marked VERIFY must be checked against your broker / prop firm before
# trusting results. Wrong contract values = wrong position sizes.

mode: backtest            # backtest | demo | live   (live also needs --i-accept-real-money-risk)

account:
  starting_balance: 10000  # GatesFX demo #2594911 (confirmed via API 2026-11-04)
  currency: USD

# Account protection limits. The bot treats these as HARD limits.
# Tuned to the leaks found in the 2026-01..08 GatesFX trade history
# (adding to losers, oversizing, no stops, instant re-entry, overtrading).
prop_rules:
  firm: personal-gatesfx
  phase: funded                   # funded = no "profit target reached" stop
  profit_target_pct: 100.0
  daily_loss_pct: 100.0           # day stop OFF (Ricardo 2026-11-09, demo). Was -10%/day
  daily_loss_basis: start_of_day
  max_drawdown_pct: 50.0          # backstop only: bot stops at -45% from the start (~$5,500). Was -30% (Ricardo 2026-11-09, demo)
  drawdown_type: static
  trailing_on: equity
  trail_locks_at_initial: true
  min_trading_days: 0
  safety_buffer: 0.9              # bot stops at 90% of each limit (equity is only checked between polls)
  daily_breach_permanent: false   # hitting the day limit = done for today, NOT a permanent stop

risk:
  risk_per_trade_pct: 1.0         # max loss per trade = 1% of account (~$95 on $9.5k) - lowered from 5% by Ricardo 2026-11-09 (demo)
  max_trades_per_day: 100000      # no cap (demo learning mode since 2026-11-05, Ricardo); was 8
  max_consecutive_losses: 100000  # no cap (demo learning mode); was 3 in a row = done for the day
  max_open_positions: 1           # one trade at a time
  max_lots: 2.0                   # hard cap (history: up to 4 lots on ~$2k)
  max_room_fraction_per_trade: 0.6   # a trade may use at most 60% of the room left to the day/account stop
  cooldown_after_loss_minutes: 0  # no cooldown (demo learning mode); was 15
  max_sizing_equity: 10000        # size from real money only, never bonus credit
  guardian: true                  # also police MANUAL trades: no stop / adding / during halts -> closed
  core_hours: "08:00-11:00"       # full risk only here (NY): the tested, profitable window
  off_hours_risk_pct: 1.0         # all other hours: 1% per trade (no strategy enters outside 08-11 now)
  min_target_r: 1.0               # never take a trade whose target pays < 1x risk at the actual fill price
  max_spread_mult: 3.0            # skip an entry when the live spread is over 3x normal (news spikes, rollover)

session:
  timezone: America/New_York
  open: "09:30"
  # Around the clock (24/5): gold trades ~23h a day. The bot (and manual trades, via the
  # guardian) may enter any time except the daily break; everything is flat during the break.
  trade_start: "00:00"
  last_entry: "16:30"             # last entry before the daily break
  flat_by: "16:50"                # flat before gold's 17:00 NY daily close, every day (and Friday)
  reopen: "18:05"                 # entries resume after the reopen (Asia session)
  weekdays: [0, 1, 2, 3, 4]       # Mon-Fri
  overnight: false

# Times (exchange local timezone) when the bot will not open trades and will
# close open ones, e.g. CPI / FOMC / NFP. Format: "YYYY-MM-DD HH:MM" with minutes either side.
news_blackouts:
  minutes_before: 15
  minutes_after: 15
  events: []                      # extra events by hand, e.g. "2026-11-07 08:30"
  # High-impact USD events from the economic calendar, refreshed automatically
  # (atlas_trader/news.py). The morning Telegram message lists today's events.
  feed_file: state/news_events.json
  feed:
    url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
    countries: [USD]
    impacts: [High]
    refresh_hours: 6

# Instruments as named on GatesFX TradeLocker. Specs read from the TradeLocker API
# on 2026-11-04 (lotSize 100, lotStep 0.01, minLot 0.01 for all four).
# value_per_point = P/L in USD for a 1.0 price move with 1.0 lot (= lotSize).
# Spreads observed via API off-hours (conservative for the NY session).
instruments:
  XAUUSD.R:
    value_per_point: 100.0
    min_lot: 0.01
    lot_step: 0.01
    spread_points: 0.14
    slippage_points: 0.10
    commission_per_lot: 3.5       # $7.00 opening fee per lot, modelled as 3.5 per side
  NAS100.R:
    value_per_point: 100.0
    min_lot: 0.01
    lot_step: 0.01
    spread_points: 1.39
    slippage_points: 0.5
    commission_per_lot: 3.5       # VERIFY: fee not confirmed for indices; assumed same as gold
  US30.R:
    value_per_point: 100.0
    min_lot: 0.01
    lot_step: 0.01
    spread_points: 2.15
    slippage_points: 1.0
    commission_per_lot: 3.5       # VERIFY
  SPX500.R:
    value_per_point: 100.0
    min_lot: 0.01
    lot_step: 0.01
    spread_points: 0.69
    slippage_points: 0.25
    commission_per_lot: 3.5       # VERIFY

# Which strategy runs on which instrument. Params override strategy defaults.
# Every strategy that failed testing was deleted on 2026-11-05 (Ricardo); results in docs/RESULTS_*.md.
# PAUSED 2026-11-05 (Ricardo): no bot-generated entries until a new strategy passes the backtest.
# 2026-11-06: two new archetypes PASSED research/archetypes_study.py (positive in both halves of
# 3.7 years, >= 100 trades; NOT strong, t < 2.5) and resume bot entries on the demo:
# docs/RESULTS_ARCHETYPES_2026-11-06.md. TradingView alerts are OFF (webhook below, 2026-11-07).
# To resume momentum_rsi as well, un-comment its block below.
strategies:
  # smc_ob = H4 EMA-50 bias -> 5m liquidity sweep (24 candles) -> displacement FVG -> order-block
  # retest; stop beyond the sweep; no fixed target, candle trailing from +1R.
  # Study: n=270, 37% wins, +0.209R/trade, t=1.56 (A +0.066, B +0.336).
  - name: smc_ob
    instruments: [XAUUSD.R]
    timeframe: 5m
    history_bars: 6000              # ~3 weeks, so the H4 EMA-50 is warmed up
    params:
      sweep_bars: 24
      reward_risk: 0.0
      hours: "08:00-11:00"
  # st_confluence = SuperTrend(10,3) trend + MACD agrees + above-average volume, pullback to the
  # SuperTrend line -> entry; stop beyond the line; trail from +1R; SuperTrend flip exits.
  # Study: n=113, 42.5% wins, +0.054R/trade, t=0.46 (A +0.069, B +0.038) - a marginal pass.
  - name: st_confluence
    instruments: [XAUUSD.R]
    timeframe: 15m
    history_bars: 600
    params:
      st_mult: 3.0
      vol_mult: 0.0
      hours: "08:00-11:00"
  # momentum_rsi = RSI crosses 50 on an aggressive candle (with the 50 EMA trend) -> ride it:
  # stop beyond the candle, trailing stop, aggressive candles pull the stop to mid-candle.
  # Status: UNPROVEN. Re-enabled 2026-11-09 (Ricardo) alongside smc_ob + st_confluence.
  - name: momentum_rsi
    instruments: [XAUUSD.R]
    timeframe: 5m
    history_bars: 600
    params:                         # shoot-out #1: 5m, disp 1.0, EMA trend = +0.23R/trade, both halves positive
      disp_atr: 1.0
      trend_filter: true
      trail_start_r: 1.0             # trail from +1R (replay 2026-11-05: +55R vs +34R when trailing from first profit)
      trail_buf_atr: 0.3
      spike_atr: 2.0
      hours: "08:00-11:00"          # 08-11 only: all-hours entries lost (no_chase_study -261R / -29R;
                                    # full_retest_study 2026-11-09). Back from 24/5 on 2026-11-09 (Ricardo).
      max_candle_atr: 2.5           # no-chase: skip exhaustion spike candles (range > 2.5 x ATR)
      max_run_atr: 3.0              # no-chase: skip if price already ran > 3 x ATR in the last hour
      run_bars: 12                  # (12 x 5m). 08-11 + no-chase: +42.6R / +119.7R per half vs
                                    # +15.7R / +75.9R without (docs/RESULTS_NO_CHASE_2026-11-06.md)

  # ======================================================================================
  # Re-test 2026-11-09 (research/full_retest_study.py, 3.7 yrs 5m / 13 mo 1m, real costs):
  # of every setup re-added that day, ONLY these two passed (positive in both halves, >= 100
  # trades), and only at 08-11 NY. Every all-hours version lost. The other 14 were removed from
  # the bot (code kept). Order = priority: the 3 proven setups above come first.
  # ======================================================================================
  - name: reversal_trail            # Card 5: fast move + extreme RSI -> CHoCH, target 50% of the move
    label: reversal_trail_1m        # re-test: 123 trades, 69.1% wins, +0.085R (A +0.025, B +0.143), t 1.21
    instruments: [XAUUSD.R]
    timeframe: 1m
    history_bars: 600
    params: {move_atr: 5.0, rsi_level: 25, target: half_move, spike_atr: 0.0, hours: "08:00-11:00"}
  - name: chart_patterns            # symmetrical triangle only: 153 trades, 39.2% wins, +0.024R
    label: symmetrical_triangle     # (A +0.040, B +0.008), t 0.2 - a marginal pass, first to cut
    instruments: [XAUUSD.R]
    timeframe: 5m
    history_bars: 600
    params: {patterns: symmetrical_triangle, hours: "08:00-11:00"}

tradelocker:
  # GatesFX demo accounts are on demo.tradelocker.com (confirmed via API).
  # The account-ID allowlist keeps the bot on the intended account.
  demo_url: https://demo.tradelocker.com
  live_url: https://live.tradelocker.com
  demo_account_ids: [2594911]     # GatesFX TradeLocker DEMO #2594911 (server GATESFX)
  live_account_ids: []            # fill in only when going live

webhook:
  # TradingView alerts are executed through the same risk engine.
  enabled: false                  # OFF 2026-11-07 (Ricardo): no alert ever reached the bot and no
                                  # alert-based model (e.g. Silver Bullet) passed testing. Nothing listens
                                  # on port 80 now. true = start the receiver with `atlas run`.
  host: 0.0.0.0
  port: 80                        # TradingView only sends to ports 80/443
  default_reward_risk: 2.0
  symbol_aliases:                 # TradingView ticker -> GatesFX name
    XAUUSD: XAUUSD.R
    GOLD: XAUUSD.R
  max_alert_age_seconds: 120      # ignore alerts that arrive late
  max_entry_slip_r: 0.25          # skip if price is already >0.25R past the setup's entry
  allowed_ips:                    # only TradingView may send alerts (its published webhook IPs,
    - 52.89.214.238               # checked 2026-11-07); the secret is checked as well
    - 34.212.75.30
    - 54.218.53.128
    - 52.32.178.7

monitoring:
  label: "Atlas $10k bot"            # prefix on every Telegram message
  healthcheck_env: HEALTHCHECK_URL      # env var holding this bot's healthchecks.io ping URL
  daily_report: true          # morning "armed" message + end-of-day report

paths:
  state_dir: state
  log_dir: logs
  report_dir: reports
  kill_switch_file: state/KILL     # create this file to flatten everything and stop the bot
